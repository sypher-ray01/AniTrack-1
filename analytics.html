<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal viewing statistics and analytics on AniTrack.">
  <meta name="theme-color" content="#0D0D0D">
  <title>My Analytics — AniTrack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/badges.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/analytics.css">
  <script>const t=localStorage.getItem('at_theme');if(t)document.documentElement.dataset.theme=t;</script>
</head>
<body data-page="analytics" data-theme="dark">

  <nav id="navbar"></nav>

  <main class="page-wrapper">
    <div class="container">
      <section class="section">

        <!-- ═══ Page Header ═══ -->
        <header class="analytics-header">
          <h1 class="analytics-title">📊 My Analytics</h1>
          <p class="analytics-subtitle">Your personal viewing stats</p>
        </header>

        <!-- ═══ Stat Cards ═══ -->
        <div class="stat-grid" id="analytics-stats">
          
          <div class="stat-card">
            <div class="stat-icon">📺</div>
            <div class="stat-info">
              <span class="stat-value"><span class="skeleton" style="display:inline-block;width:60px;height:28px;border-radius:4px"></span></span>
              <span class="stat-label">Total Shows</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">▶️</div>
            <div class="stat-info">
              <span class="stat-value"><span class="skeleton" style="display:inline-block;width:75px;height:28px;border-radius:4px"></span></span>
              <span class="stat-label">Total Episodes</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">⏱️</div>
            <div class="stat-info">
              <span class="stat-value"><span class="skeleton" style="display:inline-block;width:85px;height:28px;border-radius:4px"></span></span>
              <span class="stat-label">Hours Watched</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon gold">⭐</div>
            <div class="stat-info">
              <span class="stat-value"><span class="skeleton" style="display:inline-block;width:50px;height:28px;border-radius:4px"></span></span>
              <span class="stat-label">Average Score</span>
            </div>
          </div>

        </div>

        <!-- ═══ Charts Section ═══ -->
        <div class="charts-row">
          
          <div class="chart-card">
            <h3 class="chart-title">Genre Distribution</h3>
            <!-- Chart.js fills this canvas -->
            <div class="chart-container-300">
              <canvas id="chart-genres"></canvas>
            </div>
          </div>

          <div class="chart-card">
            <h3 class="chart-title">Status Breakdown</h3>
            <!-- Chart.js fills this canvas -->
            <div class="chart-container-300">
              <canvas id="chart-status"></canvas>
            </div>
          </div>

          <div class="chart-card full-width">
            <h3 class="chart-title">Monthly Activity</h3>
            <!-- Chart.js fills this canvas -->
            <div class="chart-container-200">
              <canvas id="chart-activity"></canvas>
            </div>
          </div>

        </div>

        <!-- ═══ Top 5 Rated ═══ -->
        <div class="top-rated-section">
          <h2 class="section-title">Top 5 Rated</h2>
          
          <div class="top-table-wrap">
            <table class="top-table">
              <thead>
                <tr>
                  <th class="top-rank">#</th>
                  <th>Anime</th>
                  <th>Your Score</th>
                  <th>Episodes</th>
                </tr>
              </thead>
              <tbody id="top-rated-tbody">
                <!-- Skeleton Rows -->
                <tr>
                  <td class="top-rank">1</td>
                  <td>
                    <div class="top-title-cell">
                      <div class="top-cover skeleton"></div>
                      <span class="skeleton" style="display:inline-block;width:200px;height:16px;border-radius:3px"></span>
                    </div>
                  </td>
                  <td><span class="top-score"><span class="skeleton" style="display:inline-block;width:40px;height:16px;border-radius:3px"></span></span></td>
                  <td><span class="skeleton" style="display:inline-block;width:60px;height:14px;border-radius:3px"></span></td>
                </tr>
                <tr>
                  <td class="top-rank">2</td>
                  <td>
                    <div class="top-title-cell">
                      <div class="top-cover skeleton"></div>
                      <span class="skeleton" style="display:inline-block;width:180px;height:16px;border-radius:3px"></span>
                    </div>
                  </td>
                  <td><span class="top-score"><span class="skeleton" style="display:inline-block;width:40px;height:16px;border-radius:3px"></span></span></td>
                  <td><span class="skeleton" style="display:inline-block;width:55px;height:14px;border-radius:3px"></span></td>
                </tr>
                <tr>
                  <td class="top-rank">3</td>
                  <td>
                    <div class="top-title-cell">
                      <div class="top-cover skeleton"></div>
                      <span class="skeleton" style="display:inline-block;width:220px;height:16px;border-radius:3px"></span>
                    </div>
                  </td>
                  <td><span class="top-score"><span class="skeleton" style="display:inline-block;width:40px;height:16px;border-radius:3px"></span></span></td>
                  <td><span class="skeleton" style="display:inline-block;width:50px;height:14px;border-radius:3px"></span></td>
                </tr>
                <tr>
                  <td class="top-rank">4</td>
                  <td>
                    <div class="top-title-cell">
                      <div class="top-cover skeleton"></div>
                      <span class="skeleton" style="display:inline-block;width:190px;height:16px;border-radius:3px"></span>
                    </div>
                  </td>
                  <td><span class="top-score"><span class="skeleton" style="display:inline-block;width:40px;height:16px;border-radius:3px"></span></span></td>
                  <td><span class="skeleton" style="display:inline-block;width:45px;height:14px;border-radius:3px"></span></td>
                </tr>
                <tr>
                  <td class="top-rank">5</td>
                  <td>
                    <div class="top-title-cell">
                      <div class="top-cover skeleton"></div>
                      <span class="skeleton" style="display:inline-block;width:210px;height:16px;border-radius:3px"></span>
                    </div>
                  </td>
                  <td><span class="top-score"><span class="skeleton" style="display:inline-block;width:40px;height:16px;border-radius:3px"></span></span></td>
                  <td><span class="skeleton" style="display:inline-block;width:65px;height:14px;border-radius:3px"></span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ═══ Recommendations Row ═══ -->
        <div class="recommendations-section">
          <div class="cards-header">
            <h2 class="cards-header-title">Recommended For You</h2>
          </div>
          
          <div class="cards-row-wrapper">
            <button class="cards-nav-btn prev" aria-label="Previous">&lsaquo;</button>
            <div class="cards-row" id="recommendations-row">
              <!-- Skeleton Cards -->
              <div class="anime-card skeleton">
                <div class="anime-card-cover"></div>
              </div>
              <div class="anime-card skeleton">
                <div class="anime-card-cover"></div>
              </div>
              <div class="anime-card skeleton">
                <div class="anime-card-cover"></div>
              </div>
              <div class="anime-card skeleton">
                <div class="anime-card-cover"></div>
              </div>
              <div class="anime-card skeleton">
                <div class="anime-card-cover"></div>
              </div>
              <div class="anime-card skeleton">
                <div class="anime-card-cover"></div>
              </div>
            </div>
            <button class="cards-nav-btn next" aria-label="Next">&rsaquo;</button>
          </div>
        </div>

      </section>
    </div>
  </main>

  <!-- Load Chart.js via CDN (Structure only, logic is deferred to JS phase) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/api-bridge.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
