<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Character profile — voice actors, anime appearances, and biographical info on AniTrack.">
  <meta name="theme-color" content="#0D0D0D">
  <title>Character — AniTrack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/badges.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/character.css">
  <script>const t=localStorage.getItem('at_theme');if(t)document.documentElement.dataset.theme=t;</script>
</head>
<body data-page="character" data-theme="dark">

  <nav id="navbar"></nav>

  <main class="page-wrapper">
    <div class="container">
      <section class="section-sm">

        <!-- ═══ Character Hero: Image + Info ═══ -->
        <div class="character-hero" id="character-hero">
          <!-- Image -->
          <div class="character-image" id="character-image">
            <div class="character-image-skeleton skeleton"></div>
          </div>

          <!-- Info -->
          <div class="character-info" id="character-info">
            <div>
              <h1 class="character-name" id="character-name">
                <span class="skeleton" style="display:inline-block;height:32px;width:220px;border-radius:6px"></span>
              </h1>
              <p class="character-name-jp" id="character-name-jp">
                <span class="skeleton" style="display:inline-block;height:16px;width:160px;border-radius:4px"></span>
              </p>
            </div>

            <!-- Meta Info -->
            <div class="character-meta" id="character-meta">
              <div class="character-meta-item">
                <span class="character-meta-label">Favorites:</span>
                <strong id="character-favorites"><span class="skeleton" style="display:inline-block;width:40px;height:14px;border-radius:3px"></span></strong>
              </div>
              <div class="character-meta-item">
                <span class="character-meta-label">MAL ID:</span>
                <strong id="character-mal-id"><span class="skeleton" style="display:inline-block;width:50px;height:14px;border-radius:3px"></span></strong>
              </div>
            </div>

            <!-- About / Biography -->
            <div class="character-about" id="character-about">
              <div class="skeleton-paragraph">
                <div class="skeleton-text skeleton" style="width:100%"></div>
                <div class="skeleton-text skeleton" style="width:92%"></div>
                <div class="skeleton-text skeleton" style="width:88%"></div>
                <div class="skeleton-text skeleton" style="width:75%"></div>
                <div class="skeleton-text skeleton" style="width:80%"></div>
              </div>
              <div class="character-about-fade"></div>
            </div>
            <button class="character-about-toggle hidden" id="character-about-toggle">Read more</button>
          </div>
        </div>

        <!-- ═══ Voice Actors ═══ -->
        <div class="character-section" id="voice-actors-section">
          <h2 class="character-section-title">🎙️ Voice Actors</h2>
          <div class="va-table-wrap">
            <table class="va-table" id="va-table">
              <thead>
                <tr>
                  <th>Person</th>
                  <th>Language</th>
                </tr>
              </thead>
              <tbody id="va-tbody">
                <tr>
                  <td>
                    <div class="va-cell">
                      <div class="skeleton" style="width:44px;height:44px;border-radius:50%;flex-shrink:0"></div>
                      <div>
                        <div class="skeleton" style="width:120px;height:14px;border-radius:3px;margin-bottom:4px"></div>
                      </div>
                    </div>
                  </td>
                  <td><div class="skeleton" style="width:60px;height:14px;border-radius:3px"></div></td>
                </tr>
                <tr>
                  <td>
                    <div class="va-cell">
                      <div class="skeleton" style="width:44px;height:44px;border-radius:50%;flex-shrink:0"></div>
                      <div>
                        <div class="skeleton" style="width:140px;height:14px;border-radius:3px;margin-bottom:4px"></div>
                      </div>
                    </div>
                  </td>
                  <td><div class="skeleton" style="width:60px;height:14px;border-radius:3px"></div></td>
                </tr>
                <tr>
                  <td>
                    <div class="va-cell">
                      <div class="skeleton" style="width:44px;height:44px;border-radius:50%;flex-shrink:0"></div>
                      <div>
                        <div class="skeleton" style="width:110px;height:14px;border-radius:3px;margin-bottom:4px"></div>
                      </div>
                    </div>
                  </td>
                  <td><div class="skeleton" style="width:60px;height:14px;border-radius:3px"></div></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ═══ Anime Appearances ═══ -->
        <div class="character-section" id="appearances-section">
          <h2 class="character-section-title">📺 Anime Appearances</h2>
          <div class="character-appearances-grid" id="appearances-grid">
            <div class="skeleton-card"><div class="skeleton-card-cover skeleton"></div><div class="skeleton-card-body"><div class="skeleton-card-title skeleton"></div><div class="skeleton-card-meta skeleton"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-card-cover skeleton"></div><div class="skeleton-card-body"><div class="skeleton-card-title skeleton"></div><div class="skeleton-card-meta skeleton"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-card-cover skeleton"></div><div class="skeleton-card-body"><div class="skeleton-card-title skeleton"></div><div class="skeleton-card-meta skeleton"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-card-cover skeleton"></div><div class="skeleton-card-body"><div class="skeleton-card-title skeleton"></div><div class="skeleton-card-meta skeleton"></div></div></div>
          </div>
        </div>

      </section>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/api-bridge.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
